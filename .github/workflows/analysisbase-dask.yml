name: Build analysis-dask-base

on:
  push:
    branches: [main]
    paths:
      - 'images/analysisbase-dask/**'
      - '.github/workflows/analysisbase-dask.yml'
      - '.github/workflows/_build-and-push.yml'
  pull_request:
    branches: [main]
    paths:
      - 'images/analysisbase-dask/**'
      - '.github/workflows/analysisbase-dask.yml'
      - '.github/workflows/_build-and-push.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to apply (e.g. 25.2.27)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build-and-push.yml
    with:
      images: |-
        sslhep/analysis-dask-base
        hub.opensciencegrid.org/usatlas/analysis-dask-base
      context: images/analysisbase-dask
      dockerfile: images/analysisbase-dask/docker/Dockerfile
      platforms: linux/amd64
      push: ${{ github.event_name != 'pull_request' }}
      version: ${{ github.event.inputs.version || '' }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
      OSG_HARBOR_USERNAME: ${{ secrets.OSG_HARBOR_USERNAME }}
      OSG_HARBOR_PASSWORD: ${{ secrets.OSG_HARBOR_PASSWORD }}
